
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Advent Calendar 2026 ➜ 2027</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: #fff4d8;
  font-family: Georgia, serif;
  background: radial-gradient(ellipse at top,
    #1b6045, #0b3829 45%, #041b15);
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 40px 15px 20px;
}

.eyebrow {
  color: #e7c878;
  letter-spacing: 5px;
  font: 12px Arial;
}

h1 {
  font-size: clamp(32px, 7vw, 65px);
  color: #ffe6a4;
  text-shadow: 0 4px 22px #0008;
}

.subtitle {
  font: 15px Arial;
  color: #ffe6a4;
  letter-spacing: 2px;
}

.ornament {
  color: #e7c878;
  font-size: 24px;
  margin: 15px;
}

.progress-wrap {
  width: min(520px, 90%);
  margin: 20px auto;
  font: 13px Arial;
}

.progress-line {
  height: 9px;
  border: 1px solid #d9b969;
  border-radius: 20px;
  background: #061a14;
  margin-top: 9px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #b41f2c, #f2d27b);
  transition: width .35s;
}

main {
  width: min(1120px, 94%);
  margin: 20px auto 60px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 13px;
}

.door {
  min-height: 178px;
  border: 1px solid #d9bb70;
  border-radius: 13px;
  overflow: hidden;
  background: linear-gradient(145deg, #a92531, #64121d);
  box-shadow: 0 7px 18px #0005;
  cursor: pointer;
  position: relative;
  padding: 0;
  color: white;
  transition: .2s;
}

.door:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 24px #0008;
}

.door img {
  width: 100%;
  height: 128px;
  object-fit: cover;
  display: block;
  background: #123b2c;
}

.number {
  position: absolute;
  top: 12px;
  left: 12px;
  background: #09291f;
  color: #ffe4a0;
  border: 1px solid #e7c878;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font: bold 15px Arial;
  z-index: 2;
}

.caption {
  display: block;
  padding: 9px 7px 12px;
  font: 12px Arial;
}

.door.opened {
  background: linear-gradient(145deg, #174e38, #0b2d21);
}

.door.opened .number {
  background: #e6c879;
  color: #173424;
}

.door.special {
  grid-column: span 2;
  min-height: 205px;
  background: linear-gradient(145deg, #e0b75c, #8c202b);
  box-shadow: 0 0 26px #e5c36b55;
}

.door.special img {
  height: 150px;
}

.door.special .caption {
  font-size: 15px;
  font-weight: bold;
}

/* Footer */

footer {
  text-align: center;
  color: #d8c69d;
  font: 12px Arial;
  padding: 25px 15px 35px;
  border-top: 1px solid #d9bb7033;
  margin-top: 30px;
}

.creator {
  display: inline-block;
  color: #e7c878;
  font-family: Georgia, serif;
  font-size: 15px;
  letter-spacing: 2px;
  margin-top: 5px;
  text-shadow: 0 0 12px #e7c87855;
}

/* Snow */

.snow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}

.snow i {
  position: absolute;
  top: -20px;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(110vh) translateX(35px);
  }
}

/* Modal */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #000b;
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 18px;
}

.modal.show {
  display: flex;
}

.panel {
  width: min(760px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: linear-gradient(145deg, #123f2e, #071e17);
  border: 1px solid #e7c878;
  border-radius: 20px;
  padding: 25px;
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 25px;
  position: relative;
}

.poster {
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  border-radius: 10px;
}

.info h2 {
  color: #ffe4a0;
  font-size: 30px;
}

.info p {
  font: 15px/1.65 Arial;
  color: #e8e1d1;
}

.close {
  position: absolute;
  right: 15px;
  top: 13px;
  border: 1px solid #d9bb70;
  background: #8f1e29;
  color: white;
  border-radius: 30px;
  padding: 9px 17px;
  cursor: pointer;
}

@media(max-width:760px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
  }

  .door {
    min-height: 145px;
  }

  .door img {
    height: 100px;
  }
}

@media(max-width:460px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .door {
    min-height: 137px;
  }

  .door img {
    height: 94px;
  }

  .door.special {
    grid-column: span 3;
  }

  .panel {
    grid-template-columns: 1fr;
    gap: 14px;
    padding: 20px;
  }

  .poster {
    max-height: 280px;
    width: auto;
    max-width: 100%;
    justify-self: center;
  }

  .info {
    text-align: center;
  }
}
</style>
</head>

<body>

<div class="snow" id="snow"></div>

<header>
  <div class="eyebrow">
    A little Christmas magic
  </div>

  <h1>Christmas Advent Calendar</h1>

  <div class="subtitle">
    December 1 — 31 · 2026 ➜ 2027
  </div>

  <div class="ornament">
    ✦ ❄ ✦
  </div>

  <div class="progress-wrap">
    <span id="progressText">
      0/31 doors opened
    </span>

    <div class="progress-line">
      <div class="progress" id="progressBar"></div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="calendar"></div>
</main>

<footer>
  <div>Made with Christmas magic 🎄</div>

  <br>

  <div class="creator">
    Created by Lernik Egnatosyan
  </div>

  <br>

  <div>Christmas 2026 — 2027</div>
</footer>

<div class="modal" id="modal">

  <div class="panel">

    <button class="close" id="closeBtn">
      Close ✕
    </button>

    <img
      class="poster"
      id="modalPoster"
      alt="Movie poster"
    >

    <div class="info">

      <div id="dayLabel"></div>

      <h2 id="movieTitle"></h2>

      <p id="movieDescription"></p>

    </div>

  </div>
</div>

<script>

const movies = [

["The Grinch (2018)", "The_Grinch_(film)"],

["The Polar Express (2004)", "The_Polar_Express_(film)"],

["Klaus (2019)", "Klaus_(film)"],

["Elf (2003)", "Elf_(film)"],

["The Christmas Chronicles (2018)", "The_Christmas_Chronicles"],

["The Christmas Chronicles 2 (2020)", "The_Christmas_Chronicles_2"],

["A Christmas Carol (2009)", "A_Christmas_Carol_(2009_film)"],

["Arthur Christmas (2011)", "Arthur_Christmas"],

["The Santa Clause (1994)", "The_Santa_Clause"],

["The Santa Clause 2 (2002)", "The_Santa_Clause_2"],

["The Santa Clause 3 (2006)", "The_Santa_Clause_3:_The_Escape_Clause"],

["Jingle All the Way (1996)", "Jingle_All_the_Way"],

["Miracle on 34th Street (1994)", "Miracle_on_34th_Street_(1994_film)"],

["The Nightmare Before Christmas (1993)", "The_Nightmare_Before_Christmas"],

["Rise of the Guardians (2012)", "Rise_of_the_Guardians"],

["A Boy Called Christmas (2021)", "A_Boy_Called_Christmas"],

["Noelle (2019)", "Noelle_(film)"],

["The Princess Switch (2018)", "The_Princess_Switch"],

["The Princess Switch: Switched Again (2020)", "The_Princess_Switch:_Switched_Again"],

["Let It Snow (2019)", "Let_It_Snow_(2019_film)"],

["Love Actually (2003)", "Love_Actually"],

["Last Christmas (2019)", "Last_Christmas_(film)"],

["The Holiday (2006)", "The_Holiday"],

["Christmas with the Kranks (2004)", "Christmas_with_the_Kranks"],

["Deck the Halls (2006)", "Deck_the_Halls_(2006_film)"],

["The Family Stone (2005)", "The_Family_Stone"],

["Four Christmases (2008)", "Four_Christmases"],

["The Muppet Christmas Carol (1992)", "The_Muppet_Christmas_Carol"],

["Spirited (2022)", "Spirited_(film)"],

["8-Bit Christmas (2021)", "8-Bit_Christmas"],

["Home Alone (1990)", "Home_Alone"]

];

const cache = new Map();

const usedPosterUrls = new Set();

let opened = new Set(
  JSON.parse(
    localStorage.getItem("christmasAdvent2026Opened") || "[]"
  )
);

const calendar = document.getElementById("calendar");

const modal = document.getElementById("modal");

function fallbackFor(index) {

  const title = movies[index][0]
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;");

  const hue = (index * 37 + 145) % 360;

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 300 430">

    <rect width="300" height="430"
      fill="hsl(${hue},45%,19%)"/>

    <rect x="12" y="12" width="276" height="406"
      rx="12" fill="none"
      stroke="#d9bb70" stroke-width="2"/>

    <text x="150" y="105"
      fill="#e7c878" font-size="54"
      text-anchor="middle">✦</text>

    <text x="150" y="210"
      fill="#fff0c7" font-size="18"
      text-anchor="middle">${title}</text>

    <text x="150" y="300"
      fill="#d9bb70" font-size="14"
      text-anchor="middle">
      POSTER NOT AVAILABLE
    </text>

  </svg>`;

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(svg);
}

function updateProgress() {

  const n = opened.size;

  document.getElementById("progressText")
    .textContent = `${n}/31 doors opened`;

  document.getElementById("progressBar")
    .style.width = (n / 31 * 100) + "%";

}

function buildCalendar() {

  movies.forEach((movie, i) => {

    const day = i + 1;

    const btn = document.createElement("button");

    btn.className = "door" +
      (opened.has(day) ? " opened" : "") +
      (day === 31 ? " special" : "");

    btn.type = "button";

    btn.innerHTML = `

      <span class="number">${day}</span>

      <img
        loading="lazy"
        src="${fallbackFor(i)}"
        alt=""
      >

      <span class="caption">
        ${day === 31
          ? "★ FINAL CHRISTMAS DAY ★"
          : "December " + day}
      </span>

    `;

    btn.addEventListener("click", () => {
      openMovie(day);
    });

    calendar.appendChild(btn);

    loadMovie(i).then(data => {

      const img = btn.querySelector("img");

      if (data.thumbnail) {
        img.src = data.thumbnail;
      }

    });

  });

  updateProgress();

}

async function loadMovie(index) {

  if (cache.has(index)) {
    return cache.get(index);
  }

  const slug = movies[index][1];

  const promise = (async () => {

    try {

      const response = await fetch(
        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
        encodeURIComponent(slug)
      );

      if (!response.ok) {
        throw new Error("No page");
      }

      const data = await response.json();

      let thumbnail = data.thumbnail?.source || null;

      if (thumbnail && usedPosterUrls.has(thumbnail)) {
        thumbnail = null;
      }

      if (thumbnail) {
        usedPosterUrls.add(thumbnail);
      }

      return {

        thumbnail,

        description: data.extract ||
          "A festive movie to enjoy during the Christmas season."

      };

    } catch (error) {

      return {

        thumbnail: null,

        description:
          "Movie details could not be loaded. Check your internet connection and try again."

      };

    }

  })();

  cache.set(index, promise);

  return promise;

}

async function openMovie(day) {

  const index = day - 1;

  const movie = movies[index];

  const data = await loadMovie(index);

  opened.add(day);

  localStorage.setItem(
    "christmasAdvent2026Opened",
    JSON.stringify([...opened])
  );

  updateProgress();

  const poster =
    document.getElementById("modalPoster");

  poster.src = data.thumbnail || fallbackFor(index);

  poster.alt = movie[0] + " poster";

  document.getElementById("dayLabel").textContent =
    day === 31
      ? "December 31 · Christmas finale"
      : `December ${day}`;

  document.getElementById("movieTitle").textContent =
    movie[0];

  document.getElementById("movieDescription").textContent =
    data.description;

  modal.classList.add("show");

}

function closeModal() {

  modal.classList.remove("show");

}

document.getElementById("closeBtn")
  .addEventListener("click", closeModal);

modal.addEventListener("click", e => {

  if (e.target === modal) {
    closeModal();
  }

});

document.addEventListener("keydown", e => {

  if (e.key === "Escape") {
    closeModal();
  }

});

/* Snow animation */

const snow = document.getElementById("snow");

for (let i = 0; i < 55; i++) {

  const flake = document.createElement("i");

  flake.style.left =
    Math.random() * 100 + "%";

  flake.style.animationDuration =
    (7 + Math.random() * 12) + "s";

  flake.style.animationDelay =
    (-Math.random() * 18) + "s";

  flake.style.opacity =
    0.25 + Math.random() * 0.7;

  flake.style.width =
    flake.style.height =
    (2 + Math.random() * 4) + "px";

  snow.appendChild(flake);

}

buildCalendar();

</script>

</body>
</html>
